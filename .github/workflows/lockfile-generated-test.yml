name: Lockfile Generated Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lockfile-generated-test:
    name: Lockfile Test (${{ matrix.manager }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { manager: uv, lockfile: uv-lock }
          - { manager: poetry, lockfile: poetry-lock }
          - { manager: pnpm, lockfile: pnpm-lock }
          - { manager: npm, lockfile: package-lock }
          - { manager: yarn, lockfile: yarn-lock }
          - { manager: bun, lockfile: bun-lock }

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          node-version-file: ".node-version"

      - name: Setup Python
        if: matrix.manager == 'uv' || matrix.manager == 'poetry'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup uv
        if: matrix.manager == 'uv'
        uses: astral-sh/setup-uv@v10.1.0

      - name: Setup Poetry
        if: matrix.manager == 'poetry'
        uses: snok/install-poetry@v1
        with:
          version: 1.8.4

      - name: Setup Yarn
        if: matrix.manager == 'yarn'
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Setup Bun
        if: matrix.manager == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Run generated lockfile parser test
        env:
          LOCKFILE_GENERATION_TEST: "1"
        run: pnpm exec vitest run tests/${{ matrix.lockfile }}.generated.test.ts
