name: CI

on:
  push: &b { branches: [master] }
  pull_request: *b
  workflow_dispatch: null

defaults: { run: { shell: bash } }
permissions: {}
jobs:
  ci:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux x64 }
          - { os: macos-latest, name: macOS arm64 }
          - { os: windows-latest, name: Windows x64 }
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.name }})
    env: { somever: "0.9.20" }
    steps:
      - uses: actions/checkout@v7
      - parallel:
          - uses: pnpm/setup@v3
            with: { node-version-file: ".node-version" }
          - uses: kjanat/runner@master

      - name: Check formatting
        if: &Ubuntu matrix.os == 'ubuntu-latest'
        run: run format-check

      - name: Check linting
        if: *Ubuntu
        run: run lint-check

      - name: Run unit tests
        if: *Ubuntu
        run: run test

      - name: Build
        run: run build

      - name: Test action with latest version
        uses: ./
        with: { version: latest }

      - name: Verify tombi is installed
        run: tombi --version

      - name: Test action with specific version
        uses: ./
        with: { version: "${{ env.somever }}" }

      - name: Verify specific version is installed
        run: v="$(tombi --version)";
          printf 'Installed version%%3A %s\n' "${v}";
          if [[ "${v}" != *"${somever}"* ]]; then { echo "Expected version ${somever} but got ${v}" &>/dev/stderr; exit 1; }; fi
