name: "Setup Tombi"
description: "Set up your GitHub Actions workflow with Tombi"
author: "tombi-toml"
inputs:
  version:
    description: 'Version of Tombi to install (e.g., "1.0.0", "latest"). When no version source is provided, installs the Tombi version that matches this setup-tombi release. Mutually exclusive with lockfile and version-file.'
    required: false
  lockfile:
    description: "Path to a lock file used to resolve the Tombi version (uv.lock, poetry.lock, pnpm-lock.yaml, package-lock.json, yarn.lock, bun.lock, mise.lock). Mutually exclusive with version and version-file."
    required: false
  version-file:
    description: "Path to a version file used to resolve the Tombi version (.tool-versions). Mutually exclusive with version and lockfile."
    required: false
  binary-checksum:
    description: "SHA256 checksum to validate the installed executable binary"
    required: false
  checksum:
    description: "Alias for binary-checksum"
    required: false
    deprecationMessage: "Use 'binary-checksum' instead"
  archive-checksum:
    description: "SHA256 checksum to validate the downloaded archive"
    required: false
  enable-cache:
    description: 'Enable persistence of the Tombi cache. Supports "true", "false", and "auto".'
    required: false
    default: "auto"
outputs:
  cache-hit:
    description: "A boolean value to indicate whether a Tombi cache entry was restored"

runs:
  using: "node24"
  main: "dist/index.mjs"
  post: "dist/post.mjs"
  post-if: success()

branding:
  icon: "feather"
  color: "blue"
